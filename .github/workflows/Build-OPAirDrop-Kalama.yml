name: Build OPAirDrop for Realme GT5 (Kalama SM8550)

on:
  workflow_dispatch:
    inputs:
      OPAIRDROP_REPO:
        description: 'OPAirDrop source repository'
        type: string
        default: 'buguj23/OPAirDrop'
      OPAIRDROP_BRANCH:
        description: 'OPAirDrop branch'
        type: string
        default: 'kalama-sm8550'
      BUILD_KERNEL:
        description: 'Rebuild kernel modules from OnePlus tree (default false uses verified prebuilt modules)'
        type: boolean
        default: true
      CLEAN_BUILD:
        description: 'Clean cache before build'
        type: boolean
        default: false

jobs:
  build-opairdrop:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 16384
          temp-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'false'
          remove-haskell: 'true'

      - name: Setup Git Configuration
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout OPAirDrop Source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.OPAIRDROP_REPO || 'buguj23/OPAirDrop' }}
          ref: ${{ inputs.OPAIRDROP_BRANCH || 'kalama-sm8550' }}
          path: 'OPAirDrop'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;28.2.13676358'

      - name: Setup Build Environment & Repo
        if: ${{ inputs.BUILD_KERNEL == true }}
        run: |
          sudo apt-get update && sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libelf-dev libssl-dev libxml2-utils lz4 zstd python3 python3-pip zip lld llvm
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync OnePlus SM8550 Platform Tree
        if: ${{ inputs.BUILD_KERNEL == true }}
        run: |
          mkdir -p kernel_platform && cd kernel_platform
          repo init -u https://github.com/OnePlusOSS/kernel_manifest -b oneplus/sm8550 -m oneplus_ace2_pro_b.xml --depth=1 --no-clone-bundle --no-tags
          sed -i -e '/prebuilts\/asuite"/{/ks-kernel\.lnx\.5\.0\.r3-rel/d}' -e '/tools\/tradefederation\/prebuilts"/{/ks-kernel\.lnx\.5\.0\.r3-rel/d}' .repo/manifests/*.xml || true
          repo sync -c --no-clone-bundle --no-tags -j$(nproc) --force-sync

      - name: Apply OPAirDrop Driver Overlay to Kalama
        if: ${{ inputs.BUILD_KERNEL == true }}
        run: |
          cd kernel_platform
          # 1. 复制 Wonder 驱动源码至 vendor/oplus/kernel/wifi/wonder
          mkdir -p vendor/oplus/kernel/wifi/wonder
          cp -r ../OPAirDrop/kernel/wonder/* vendor/oplus/kernel/wifi/wonder/
          
          # 2. 复制独立 Provider 源码至 kernel_platform/opairshare-route-b-provider
          mkdir -p kernel_platform/opairshare-route-b-provider
          cp -r ../OPAirDrop/kernel/provider/* kernel_platform/opairshare-route-b-provider/
          sed -i 's/sun_perf/kalama_perf/g' kernel_platform/opairshare-route-b-provider/BUILD.bazel || true
          
          # 3. 为 kalama 启用 wonder 模块构建定义
          if [ -f vendor/oplus/kernel/wifi/oplus_local_modules.bzl ]; then
              sed -i 's/"canoe", "sun"/"canoe", "sun", "kalama"/g' vendor/oplus/kernel/wifi/oplus_local_modules.bzl || true
          fi
          
          # 4. 合并 driver 覆盖层至 qcacld-3.0
          python3 -c "
          import json, os, shutil
          with open('../OPAirDrop/kernel/source-map.json') as f:
              mapping = json.load(f)
          for src, meta in mapping.items():
              src_path = os.path.join('../OPAirDrop', src)
              dst_path = meta.get('kernel_path')
              if dst_path and os.path.exists(src_path) and os.path.exists(os.path.dirname(dst_path)):
                  shutil.copy2(src_path, dst_path)
                  print(f'Overlaid: {dst_path}')
          "

          # 5. 在 kernel_platform 内部建立指向 vendor 的软链接以便 Bazel 解析
          ln -sf ../vendor kernel_platform/vendor

      - name: Fast Bazel & Kbuild WLAN Modules (kiwi_v2, wonder, provider)
        if: ${{ inputs.BUILD_KERNEL == true }}
        continue-on-error: false
        run: |
          mkdir -p output-payload
          cd kernel_platform/kernel_platform
          
          # msm-kernel/BUILD.bazel 的 sources glob 只覆盖仓库里真实存在的文件。
          # source 指向 404 的专有 Kconfig 时，Bazel sandbox 里没有它，gki_defconfig 会停。
          # 按文件是否存在逐条注释，保留 $(SRCARCH) 这类要展开的行。
          python3 -c '
          import os, re
          pat = re.compile(r"^(\s*)source\s+[\"\x27]([^\"\x27]+)[\"\x27]")
          for root_dir in ["msm-kernel", "common"]:
              if not os.path.exists(root_dir):
                  continue
              for dirpath, _, filenames in os.walk(root_dir):
                  for f in filenames:
                      if f != "Kconfig" and not f.startswith("Kconfig."):
                          continue
                      kpath = os.path.join(dirpath, f)
                      with open(kpath, "r", errors="ignore") as kf:
                          lines = kf.readlines()
                      new_lines = []
                      modified = False
                      for line in lines:
                          m = pat.match(line)
                          if not m or "$" in m.group(2):
                              new_lines.append(line)
                              continue
                          rel = m.group(2)
                          if os.path.exists(os.path.join(root_dir, rel)) or os.path.exists(os.path.join(dirpath, rel)):
                              new_lines.append(line)
                              continue
                          print(f"Commenting absent source: {line.strip()} in {kpath}")
                          new_lines.append(m.group(1) + "# " + line.lstrip())
                          modified = True
                      if modified:
                          with open(kpath, "w") as kf:
                              kf.writelines(new_lines)
          '

          # Kbuild 回退走 msm-kernel。common 的 Kconfig.ext 是空占位，
          # 不设 KCONFIG_EXT_PREFIX 时不会带上 Kalama 的 vendor 配置。
          KSRC=msm-kernel
          [ -d "$KSRC" ] || KSRC=common
          cp ../../OPAirDrop/kernel/provider/Module.symvers "$KSRC/Module.symvers"
          cp ../../OPAirDrop/kernel/provider/Module.symvers opairshare-route-b-provider/Module.symvers

          CLANG_BIN=$(find prebuilts/clang/host/linux-x86 -name "clang" -type f -executable 2>/dev/null | sort -V | tail -n 1)
          CLANG_DIR=$(cd "$(dirname "$CLANG_BIN")" && pwd)
          export PATH="$CLANG_DIR:$PATH"
          BUILD_TOOLS=$(find prebuilts/kernel-build-tools/linux-x86 -name "make" -type f -executable 2>/dev/null | head -n 1)
          if [ -n "$BUILD_TOOLS" ]; then
              export PATH="$(cd "$(dirname "$BUILD_TOOLS")" && pwd):$PATH"
          fi
          echo "Using kernel tree: $KSRC"
          echo "Using compiler dir: $CLANG_DIR"

          # 1. Bazel has the GKI CFI toolchain. Its failure must not abort the step:
          #    GitHub Actions runs bash -e, and `cmd || echo` still returns 0.
          echo "=== 1. Building via Bazel ==="
          set +e
          chmod a+x tools/bazel
          sed -i 's/define_common_kernels(target_configs/define_common_kernels(branch = "android13-5.15", target_configs/' msm-kernel/BUILD.bazel
          sed -i 's/define_common_kernels(target_configs/define_common_kernels(branch = "android13-5.15", target_configs/' common/BUILD.bazel
          ./tools/bazel build //opairshare-route-b-provider:opairshare_wonder_provider
          bazel_rc=$?
          set -e
          if [ "$bazel_rc" -ne 0 ]; then
              echo "Bazel provider build failed (rc=$bazel_rc); trying Kbuild"
          fi

          find bazel-bin -name "opairshare_wonder_provider.ko" -exec cp -f {} ../../output-payload/ \; || true

          # 2. 若 Bazel 未输出 provider 模块，则使用带有 Module.symvers 的 Kbuild 作为备选
          if [ ! -f ../../output-payload/opairshare_wonder_provider.ko ]; then
              echo "=== 2. Fallback: Building opairshare_wonder_provider via Kbuild ==="
              # gki_defconfig 会重写 $KSRC/Module.symvers，modpost 前必须放回。
              make -C "$KSRC" ARCH=arm64 gki_defconfig \
                  CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- \
                  LLVM=1 LLVM_IAS=1
              if [ -f "$KSRC/arch/arm64/configs/vendor/kalama_GKI.config" ]; then
                  "$KSRC/scripts/kconfig/merge_config.sh" -m -r -y \
                      "$KSRC/.config" "$KSRC/arch/arm64/configs/vendor/kalama_GKI.config"
                  make -C "$KSRC" ARCH=arm64 olddefconfig \
                      CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- \
                      LLVM=1 LLVM_IAS=1
              fi
              make -C "$KSRC" ARCH=arm64 modules_prepare \
                  CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- \
                  LLVM=1 LLVM_IAS=1
              cp ../../OPAirDrop/kernel/provider/Module.symvers "$KSRC/Module.symvers"
              make -C "$KSRC" M="$PWD/opairshare-route-b-provider" ARCH=arm64 \
                  CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- \
                  LLVM=1 LLVM_IAS=1 modules
              cp opairshare-route-b-provider/opairshare_wonder_provider.ko ../../output-payload/
          fi
          test -f ../../output-payload/opairshare_wonder_provider.ko

      - name: Prepare Kernel Modules Payload
        run: |
          mkdir -p output-payload
          # 优先提取构建产物，若未从源码构建则使用 OPAirDrop 仓库中验证过的 prebuilt 模块
          find kernel_platform -name "opairshare_wonder_provider.ko" -exec cp {} output-payload/ \; || true
          find kernel_platform -name "wonder.ko" -exec cp {} output-payload/ \; || true
          if [ -d dist-modules ]; then
              find dist-modules -name "qca_cld3_kiwi_v2.ko" -exec cp {} output-payload/ \; || true
          fi
          if [ ! -f output-payload/qca_cld3_kiwi_v2.ko ] && [ -f OPAirDrop/module/payload/kernel/qca_cld3_kiwi_v2.ko ]; then
              echo "Using verified prebuilt qca_cld3_kiwi_v2.ko from OPAirDrop repository..."
              cp OPAirDrop/module/payload/kernel/qca_cld3_kiwi_v2.ko output-payload/
          fi
          if [ ! -f output-payload/wonder.ko ] && [ -f OPAirDrop/module/payload/kernel/wonder.ko ]; then
              echo "Using verified prebuilt wonder.ko from OPAirDrop repository..."
              cp OPAirDrop/module/payload/kernel/wonder.ko output-payload/
          fi
          if [ ! -f output-payload/opairshare_wonder_provider.ko ] && [ -f OPAirDrop/module/payload/kernel/opairshare_wonder_provider.ko ]; then
              echo "Using prebuilt opairshare_wonder_provider.ko from OPAirDrop repository..."
              cp OPAirDrop/module/payload/kernel/opairshare_wonder_provider.ko output-payload/
          fi
          test -f output-payload/opairshare_wonder_provider.ko
          test -f output-payload/wonder.ko
          test -f output-payload/qca_cld3_kiwi_v2.ko
          ls -la output-payload/

      - name: Build Native Shims & WebUI
        run: |
          cd OPAirDrop
          # 动态探测并定位可用 Android NDK
          if [ -d "$ANDROID_HOME/ndk" ]; then
              export ANDROID_NDK_HOME=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          else
              export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358
          fi
          echo "Using Android NDK: $ANDROID_NDK_HOME"
          python3 tools/build-native.py --sdk "$ANDROID_HOME" --ndk "$ANDROID_NDK_HOME" || true
          
          # 编译 WebUI
          if [ -d webui ]; then
              cd webui && npm install && npm run build && cd .. || true
          fi

      - name: Assemble Final KernelSU Module ZIP
        run: |
          cd OPAirDrop
          mkdir -p module/payload/kernel module/payload/native module/webroot
          if [ -d ../output-payload ]; then
              cp ../output-payload/*.ko module/payload/kernel/ || true
          fi
          if [ -d build/native ]; then
              cp -r build/native/* module/payload/native/ || true
          fi
          if [ -d webui/dist ]; then
              cp -r webui/dist/* module/webroot/ || true
          fi
          
          # 更新兼容性检查与驱动模块名
          sed -i 's/\[ "$board" = sun \]/case "$board" in sun|kalama) ;; *) compatibility_error "sun platform or kalama platform required; found $board"; exit 2;; esac/' module/bin/compatibility.sh || true
          sed -i 's/qca_cld3_peach_v2/qca_cld3_kiwi_v2/g' module/bin/control.sh || true
          sed -i 's/qca_cld3_peach_v2/qca_cld3_kiwi_v2/g' module/bin/common.sh || true
          
          # 提取并记录模块 Build ID
          python3 -c "
          import os, subprocess, re

          def get_build_id(path):
              res = subprocess.run(['readelf', '-n', path], capture_output=True, text=True)
              m = re.search(r'Build ID:\s+([0-9a-fA-F]+)', res.stdout)
              return '040000001400000003000000474e5500' + m.group(1).lower() if m else ''

          id_map = {
              'qca_cld3_kiwi_v2': 'module/payload/kernel/qca_cld3_kiwi_v2.ko',
              'wonder': 'module/payload/kernel/wonder.ko',
              'opairshare_wonder_provider': 'module/payload/kernel/opairshare_wonder_provider.ko',
          }
          script_path = 'module/bin/kernel-identity.sh'
          if os.path.exists(script_path):
              text = open(script_path).read()
              for mod, ko in id_map.items():
                  if os.path.exists(ko):
                      bid = get_build_id(ko)
                      if bid:
                          text = re.sub(f'NOTE_{mod}=.*', f'NOTE_{mod}={bid}', text)
              open(script_path, 'w').write(text)
          "
          
          # 生成完整 SHA256SUMS
          cd module
          find . -type f ! -name "SHA256SUMS" ! -path "./.git*" | sort | while read -r f; do
              sha256sum "$f" | sed 's| \./| |'
          done > /tmp/SHA256SUMS.new
          mv /tmp/SHA256SUMS.new SHA256SUMS
          
          # 打包 ZIP
          zip -r ../../OPAirDrop-RealmeGT5-SM8550.zip ./*

      - name: Upload Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPAirDrop-RealmeGT5-SM8550
          path: OPAirDrop-RealmeGT5-SM8550.zip
